# ---------------------------------------------------------------------------
# phpboyscout/terraform-aws-security-baseline CI pipeline.
#
# Imports the four reusable components from phpboyscout/cicd.
# Each component runs in registry.gitlab.com/phpboyscout/images/infra-tools
# at the tag pinned by the component's image_version default (v0.2.0
# as of cicd v0.1.1). Renovate keeps the @vX.Y.Z component refs
# current as cicd cuts new releases.
# ---------------------------------------------------------------------------

stages:
  - lint
  - security
  - test
  - release
  - pages
  - renovate

# Pipeline-source gating: MR pipelines are primary; tag pipelines run
# the publish fan-out; main pipelines exist only so colophon
# can maintain its MR. The `never` rule suppresses duplicate branch
# pipelines when a feature branch already has an open MR.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

variables:
  # colophon walks the full commit log to compute the next
  # Release MR + changelog.
  GIT_DEPTH: "0"

# ---------- lint: tofu fmt + tflint + terraform-docs drift -------------

include:
  # Release MR machinery — opens / updates the Release MR on every push
  # to main; merging it cuts a vX.Y.Z tag whose pipeline fires the
  # tofu-module-publish job (further below).
  - component: gitlab.com/phpboyscout/cicd/colophon@main
    inputs:
      branch: main
      stage: release


  - component: gitlab.com/phpboyscout/cicd/tofu-lint@main
    inputs:
      stage: lint
      # `.` runs `tofu fmt -recursive` from root and tflint per-path.
      # terraform-docs iterates each entry: root + each sub-module + the
      # example get their READMEs re-injected.
      paths: ". modules/account-hardening modules/alerts modules/audit-logging modules/aws-config modules/operator-role modules/threat-detection examples/minimal"

  - component: gitlab.com/phpboyscout/cicd/tofu-security@main
    inputs:
      stage: security
      # trivy / checkov walk the tree; gitleaks scans every tracked file.
      paths: "."

  - component: gitlab.com/phpboyscout/cicd/tofu-validate@main
    inputs:
      stage: test
      # Root + each sub-module + example. tofu-validate skips dirs
      # without *.tf files automatically.
      validate_paths: ". modules/account-hardening modules/alerts modules/audit-logging modules/aws-config modules/operator-role modules/threat-detection examples/minimal"

  - component: gitlab.com/phpboyscout/cicd/zensical-pages@main
    inputs:
      stage: pages
      # Defaults match: zensical.toml + docs/ + requirements-lock.txt
      # all at repo root; deploy_branch=main.

  # Publish to the GitLab Terraform Module Registry on each vX.Y.Z tag.
  # Runs in .post via CI_JOB_TOKEN (own-project package write); consumers
  # then reference gitlab.com/phpboyscout/security-baseline/aws + version.
  - component: gitlab.com/phpboyscout/cicd/tofu-module-publish@main
    inputs:
      # NOT the component's `.post` default. On a tag every other job
      # self-excludes, so a `.post` publish would be the pipeline's only
      # job — and GitLab refuses to create a pipeline made solely of
      # .pre/.post jobs, so the tag pipeline never existed and the module
      # silently never published.
      stage: release
      module_name: security-baseline
      # module_system defaults to "aws".

  # Nightly Renovate scan (schedule-gated on $RENOVATE_TASK=scan). Keeps
  # both the code dependencies and the pinned phpboyscout/cicd component
  # refs current, via the cicd preset extended in renovate.json. Runs only
  # on the renovate-daily pipeline schedule; the other jobs self-exclude
  # from schedule pipelines.
